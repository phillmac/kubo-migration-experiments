name: Rhea IAM managed policy recovery (offline fakes)

on:
  pull_request:
    paths:
      - 'scripts/rhea_gen14*.py'
      - 'scripts/run_rhea_gen14_iam*.sh'
      - 'scripts/rhea_multi_sst_marker_iam.py'
      - 'scripts/rhea_multi_sst_signed_admission.py'
      - 'tests/test_rhea_gen14*.py'
      - 'docs/rhea-gen14-iam-*.md'
      - '.github/workflows/rhea-iam-managed-recovery-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-managed-iam:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check source syntax
        run: |
          bash -n scripts/run_rhea_gen14_iam_managed.sh
          python3 -B - <<'PY'
          from pathlib import Path
          for directory in ('scripts', 'tests'):
              for path in Path(directory).glob('*gen14*.py'):
                  compile(path.read_bytes(), str(path), 'exec')
          PY
      - name: Offline credential and recovery regressions
        run: |
          python3 -B - <<'PY'
          import socket
          import unittest
          from unittest.mock import patch

          def forbidden(*args, **kwargs):
              raise AssertionError('network forbidden in IAM recovery CI')

          with patch.object(socket.socket, 'connect', forbidden), \
               patch.object(socket.socket, 'connect_ex', forbidden), \
               patch.object(socket, 'create_connection', forbidden), \
               patch.object(socket, 'getaddrinfo', forbidden):
              suite = unittest.defaultTestLoader.discover('tests', 'test_rhea_gen14*.py')
              result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Whitespace checks
        run: git diff --check
