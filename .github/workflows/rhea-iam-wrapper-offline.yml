name: Rhea Wasabi IAM wrapper (offline only)

on:
  pull_request:
    paths:
      - 'scripts/run_rhea_gen14_iam.sh'
      - 'scripts/rhea_gen14_create_iam_credentials.py'
      - 'tests/test_rhea_gen14_iam_wrapper.py'
      - 'tests/test_rhea_gen14_create_iam_credentials.py'
      - 'docs/rhea-gen14-iam-credentials-20261111.md'
      - 'docs/rhea-gen14-iam-wrapper-20261111.md'
      - '.github/workflows/rhea-iam-wrapper-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static wrapper and IAM source checks
        run: |
          set -euo pipefail
          bash -n scripts/run_rhea_gen14_iam.sh
          python3 -m unittest discover -s tests -p 'test_rhea_gen14_iam_wrapper.py' -v
          git diff --check
      - name: All offline Python regressions
        run: python3 -m unittest discover -s tests -q
      # Never invoke the real provision/verify CLI, including under root CI.
      # Tests replace the config, state, SDK, and wrapper dispatch target locally.
      - name: Fake IAM and STS provisioning tests with sockets blocked
        run: python3 -B -m unittest discover -s tests -p 'test_rhea_gen14_create_iam_credentials.py' -v
