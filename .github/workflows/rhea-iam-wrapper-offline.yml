name: Rhea Wasabi IAM wrapper (offline only)

on:
  pull_request:
    paths:
      - 'scripts/run_rhea_gen14_iam.sh'
      - 'tests/test_rhea_gen14_iam_wrapper.py'
      - 'docs/rhea-gen14-iam-wrapper-20261111.md'
      - '.github/workflows/rhea-iam-wrapper-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static wrapper and IAM source checks
        run: |
          set -euo pipefail
          bash -n scripts/run_rhea_gen14_iam.sh
          python3 -m unittest discover -s tests -p 'test_rhea_gen14_iam_wrapper.py' -v
          git diff --check
      - name: All offline Python regressions
        run: python3 -m unittest discover -s tests -q
      - name: Refusal of live credential provisioning
        run: |
          set -euo pipefail
          set +e
          private_dir="$(mktemp -d)"
          chmod 0700 "$private_dir"
          trap 'rm -rf -- "$private_dir"' EXIT
          for file in run_rhea_gen14_iam.sh rhea_gen14_iam_admin_acceptance.py rhea_multi_sst_marker_iam.py rhea_multi_sst_signed_admission.py; do
            install -m 0600 "scripts/$file" "$private_dir/$file"
          done
          /usr/bin/bash "$private_dir/run_rhea_gen14_iam.sh" provision > "$private_dir/refusal.json"
          result="$?"
          set -e
          test "$result" -eq 2
          python3 - "$private_dir/refusal.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              answer = json.load(stream)
          assert answer['result'] == 'REFUSED'
          assert answer['credentials'] == 'NOT_ACCESSED'
          assert answer['actual_enforcement_proven'] is False
          print('LIVE_IAM_REFUSED_AS_DESIGNED')
          PY
