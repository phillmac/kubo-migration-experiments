name: Rhea user-run IAM credentials (offline fakes)

on:
  pull_request:
    paths:
      - 'scripts/rhea_gen14_create_iam_credentials.py'
      - 'scripts/run_rhea_gen14_iam.sh'
      - 'scripts/rhea_gen14_iam_admin_acceptance.py'
      - 'scripts/rhea_multi_sst_marker_iam.py'
      - 'scripts/rhea_multi_sst_signed_admission.py'
      - 'tests/**.py'
      - 'docs/rhea-gen14-iam-*.md'
      - '.github/workflows/rhea-iam-credentials-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-iam:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Do not install boto3 or invoke provision/verify here. The tests replace
      # credentials, state, SDK and wrapper dispatch with local synthetic fakes.
      - name: Compile and check shell syntax
        run: |
          bash -n scripts/run_rhea_gen14_iam.sh
          python3 -B - <<'PY'
          from pathlib import Path
          for directory in ('scripts', 'tests'):
              for path in Path(directory).glob('*.py'):
                  compile(path.read_bytes(), str(path), 'exec')
          PY
      - name: All offline Python regressions with network connections forbidden
        run: |
          python3 -B - <<'PY'
          from unittest.mock import patch
          import socket
          import unittest

          def forbidden(*args, **kwargs):
              raise AssertionError('network forbidden in offline IAM CI')

          with patch.object(socket.socket, 'connect', forbidden), \
               patch.object(socket.socket, 'connect_ex', forbidden), \
               patch.object(socket, 'create_connection', forbidden), \
               patch.object(socket, 'getaddrinfo', forbidden):
              suite = unittest.defaultTestLoader.discover('tests')
              result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Whitespace checks
        run: git diff --check
